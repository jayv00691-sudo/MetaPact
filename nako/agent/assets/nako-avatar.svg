<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">桃桃 avatar</title>
  <desc id="desc">Stylized portrait avatar for 桃桃 — a tiny fluffy white kitten with peach-pink sheen, gentle peach-pink eyes, faint blush, light pink ribbon collar with a leafy peach pendant.</desc>
  <defs>
